name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions pinned to commit SHAs, not tags. A tag is mutable, and a moving major
# tag is not guaranteed to exist at all -- that exact assumption broke every job
# in a sibling repo, because a package published v9.0.0 without publishing a v9.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      # Type-checks .astro files and the content schema together, so a case study
      # missing a required field fails here rather than shipping half-rendered.
      - name: check types and content schema
        run: npx astro check

      - name: build
        run: npm run build

      # The site publishes a performance claim. This is what makes the claim
      # true tomorrow as well as today.
      - name: performance budget
        run: npm run budget

      # Real viewport emulation, because headless Chrome's --window-size has a
      # 500px floor and will happily render at 500 then crop the screenshot to
      # 390, which looks exactly like a mobile overflow bug that is not there.
      - name: install browser
        run: npx playwright install --with-deps chromium

      - name: horizontal overflow at phone widths
        run: npm run viewport

      # The exact bytes that just passed every gate above, handed to the deploy
      # job. See the comment on that job for why this is not a rebuild.
      - name: keep the checked build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Deploy runs only after the gates above pass, and only from main. Routing the
  # deploy through Actions rather than Cloudflare's git integration is what makes
  # "nothing ships that did not pass the budget" a checkable statement.
  #
  # It deploys the artifact the build job produced rather than building again.
  # A rebuild would almost certainly be byte-identical, but "almost certainly" is
  # the wrong standard for the one claim this pipeline exists to support: what
  # passed the budget would be a different build of the same commit, not the
  # bytes actually served. Downloading the artifact makes the claim literal.
  #
  # npm ci still runs, because wrangler comes from the lockfile. Letting npx
  # fetch it at deploy time would unpin the only tool that touches production.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: fetch the checked build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: deploy to cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
